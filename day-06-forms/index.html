<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 6 - Login Form | 30 Days Web Dev Challenge</title>
</head>
<body>

  <h1>Login</h1>

  <!-- form = poora form -->
  <form>
    <!-- label = input ka naam -->
    <label for="email">Email</label><br>
    <!-- type="email" = email box, required = bina bhare submit nahi hoga -->
    <input type="email" id="email" placeholder="Apna email likho..." required><br><br>

    <label for="password">Password</label><br>
    <!-- type="password" = password chhupa hua (••••) dikhta hai -->
    <input type="password" id="password" placeholder="Password" required><br><br>

    <!-- button = form submit -->
    <button type="submit">Login</button>
  </form>

</body>
</html>
