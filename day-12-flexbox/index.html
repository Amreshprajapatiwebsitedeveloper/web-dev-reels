<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 12 — Flexbox | BrightMinds Academy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar: display flex + space-between -->
  <nav class="navbar">
    <div class="logo">BrightMinds</div>
    <ul class="menu">
      <li><a href="#">Courses</a></li>
      <li><a href="#">Results</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero: perfect center -->
  <section class="hero">
    <h1>IIT-JEE &amp; NEET</h1>
    <p>Coaching • Mumbai</p>
    <div class="buttons">
      <a class="btn primary" href="#">Free Demo Class</a>
      <a class="btn" href="#">Call Now</a>
    </div>
  </section>

  <!-- Cards: flex + gap -->
  <section class="cards">
    <div class="card"><h3>500+</h3><p>Selections</p></div>
    <div class="card"><h3>12 yrs</h3><p>Experience</p></div>
    <div class="card"><h3>25</h3><p>Expert Teachers</p></div>
  </section>
</body>
</html>
