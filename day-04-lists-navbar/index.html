<!DOCTYPE html>
<html>
<head>
  <title>Day 4 - Lists & Navbar</title>
  <style>
    /* Bonus: navbar ko horizontal banane ka CSS */
    .nav { list-style: none; display: flex; gap: 24px; background: #ff2e63; padding: 16px 24px; margin: 0; }
    .nav a { color: white; text-decoration: none; font-weight: bold; font-family: sans-serif; }
  </style>
</head>
<body>
  <!-- 1. Unordered list (bullets) -->
  <ul>
    <li>Home</li>
    <li>About</li>
  </ul>

  <!-- 2. Ordered list (numbers) -->
  <ol>
    <li>HTML seekho</li>
    <li>CSS seekho</li>
  </ol>

  <!-- 3. Navbar menu = ul + li + a -->
  <ul class="nav">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
</body>
</html>
